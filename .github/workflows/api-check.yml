name: API check

on:
  push:
    paths: [".github/workflows/api-check.yml"]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Probe plane data sources
        run: |
          UA="PlaneCatcher/0.1.0 (+https://github.com/jpat-12/CSCN375-PlaneCatcher)"
          probe() {
            echo "== $1"
            code=$(curl -sS -m 20 -o body.txt -w "%{http_code}" -A "$UA" "$2")
            echo "status: $code"
            head -c 600 body.txt; echo
          }
          probe "adsb.lol" https://api.adsb.lol/v2/point/40.6413/-73.7781/9
          probe "adsb.fi" https://opendata.adsb.fi/api/v2/lat/40.6413/lon/-73.7781/dist/9
          probe "airplanes.live" https://api.airplanes.live/v2/point/40.6413/-73.7781/9
          probe "planespotters" https://api.planespotters.net/pub/photos/hex/a0b1c2
